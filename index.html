<style>
:root{--bg:#02090C;--panel:rgba(8,36,42,.55);--line:rgba(80,230,214,.18);--ink:#E8F7F5;--mute:#86A9A6;--key:#0B6E73;--key2:#12A59C;--acc:#3FE8D4;--glow:0 0 22px rgba(63,232,212,.3)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding-bottom:130px;min-height:100vh;
background:radial-gradient(900px 520px at 90% -8%,rgba(30,200,188,.34),transparent 62%),radial-gradient(700px 440px at 2% 28%,rgba(12,96,102,.42),transparent 62%),linear-gradient(#02090C,#04171B 55%,#02090C) fixed}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font-family:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:12px;padding:24px 0 14px}
.top img{border-radius:8px;box-shadow:var(--glow)}
h1{margin:0;font:800 clamp(20px,3.6vw,33px)/1 Sora,sans-serif;letter-spacing:-.02em}
.notice{margin:6px 0 0;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(10,52,58,.4);font-size:13px;line-height:1.7;color:var(--mute)}
.notice b{color:var(--ink);font-weight:700}.notice a{color:var(--acc)}
.tools{position:sticky;top:0;z-index:5;margin-top:14px;padding:12px 0;background:rgba(2,9,12,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.r1{display:flex;gap:10px}
.sw{position:relative;flex:1;min-width:0}
.sw svg{position:absolute;left:16px;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--mute);pointer-events:none}
.search{width:100%;font:inherit;padding:12px 16px 12px 46px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:var(--ink)}
.search::placeholder{color:var(--mute)}
.search:focus{border-color:var(--acc);box-shadow:var(--glow);outline:0}
.rand{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:15px;font-weight:700;padding:0 20px;border:1px solid rgba(63,232,212,.5);border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--key),var(--key2));box-shadow:var(--glow)}
.rand:hover{filter:brightness(1.15)}
.rand svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:14px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);cursor:pointer}
.chip small{margin-left:6px;opacity:.7}
.chip:hover{color:var(--ink);border-color:var(--acc)}
.chip[aria-pressed=true]{color:#fff;border-color:rgba(63,232,212,.6);background:linear-gradient(135deg,var(--key),var(--key2));box-shadow:var(--glow)}
.meta{margin:18px 0 10px;color:var(--mute);font-size:14px}
ul.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 0 40px rgba(18,165,156,.08)}
.row{display:grid;grid-template-columns:26px 40px 44px minmax(0,1fr) 110px 100px 44px 62px auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(63,232,212,.06)}
.row.on{background:rgba(18,165,156,.14);box-shadow:inset 0 0 0 1px var(--acc),0 0 22px rgba(63,232,212,.2)}
.row.on .title{color:var(--acc)}
.idx{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.ib{display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer;padding:0}
.ib svg{width:52%;height:52%}
.ib:hover{border-color:var(--acc)}
.play{width:40px;height:40px}
.row.on .play{background:linear-gradient(135deg,var(--key),var(--key2));border-color:var(--acc);color:#fff;box-shadow:var(--glow)}
.th{width:44px;height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.title{font-weight:500;overflow-wrap:anywhere}
.wave{display:flex;align-items:center;gap:2px;height:26px}
.wave i{flex:1;background:rgba(134,169,166,.4);border-radius:1px}
.wave i.f{background:var(--acc)}
.tag{font-size:13px;padding:1px 12px;border:1px solid rgba(63,232,212,.35);border-radius:999px;background:rgba(63,232,212,.08);color:var(--acc);cursor:pointer}
.num{color:var(--mute);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.dur{color:var(--ink)}
.tag{justify-self:start}
.dl{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;border:1px solid var(--line);padding:5px 14px;border-radius:999px;color:var(--ink)}
.dl svg{width:15px;height:15px}
.dl:hover{border-color:var(--acc);color:var(--acc);box-shadow:var(--glow)}
.empty{padding:40px 20px;color:var(--mute)}
footer{margin:36px 0 0;padding:20px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;gap:8px 20px;flex-wrap:wrap}
footer a{color:var(--acc)}
.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;display:none}
.bar.show{display:block}
.in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,230px) auto 1fr auto;gap:18px;align-items:center;padding:12px 18px;border:1px solid var(--line);border-radius:20px;background:rgba(4,24,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 30px rgba(18,165,156,.12)}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .th{flex:none;width:48px;height:48px}
.nt{min-width:0}
.now{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npg{font-size:12px;color:var(--acc)}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .ib{width:36px;height:36px;border-color:transparent;background:transparent}
.ctl .big{width:52px;height:52px;border:2px solid var(--acc);background:rgba(18,165,156,.25);color:#fff;box-shadow:var(--glow)}
.ctl [aria-pressed=true]{color:var(--acc);background:rgba(63,232,212,.14)}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--acc) var(--p,0%),rgba(255,255,255,.16) var(--p,0%));flex:1;min-width:0;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0;box-shadow:var(--glow)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#vol{width:90px;flex:none}
noscript ul{padding-left:20px}
@media(max-width:900px){.row{grid-template-columns:26px 40px 44px minmax(0,1fr) 100px 44px 62px auto}.row .wave{display:none}}
@media(max-width:760px){.row{grid-template-columns:40px 44px minmax(0,1fr) auto;gap:12px}.row .idx,.row .wave,.row .tag,.row .num{display:none}
.in{grid-template-columns:1fr auto;gap:10px 14px}.seek{grid-column:1/-1;order:3}.in>:last-child{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="favicon.svg" alt="" width="32" height="32"><h1>Nikutama BGM Stock</h1></div>
  <p class="notice"><b>商用利用OK・加工自由・クレジット任意。</b>音源ファイル自体の再配布・転売、YouTube Content ID等への登録、AI学習への利用は禁止です。ダウンロード・ご利用の際は<a href="terms.html">利用規約</a>への同意が必要です。</p>
  <div class="tools">
    <div class="r1">
      <div class="sw"><span data-ico="search"></span><input id="q" class="search" type="search" placeholder="曲名・ジャンルで検索" aria-label="検索"></div>
      <button id="rand" class="rand" type="button"><span data-ico="shuffle"></span>ランダム再生</button>
    </div>
    <div id="chips" class="chips" role="group" aria-label="ジャンル"></div>
  </div>
  <p id="meta" class="meta"></p>
  <ul id="list" class="list"></ul>
  <noscript>
    <p>JavaScriptが無効です。曲の一覧:</p>
    <ul><!--STATIC_LIST--></ul>
  </noscript>
  <footer>
    <a href="terms.html">利用規約・ライセンス</a>
    <span>運営: nikutama</span>
    <span>Powered by Stability AI</span>
  </footer>
</div>

<div id="bar" class="bar" aria-label="プレーヤー">
  <div class="in">
    <div class="np"><div id="pth" class="th"></div><div class="nt"><div id="now" class="now"></div><div id="npg" class="npg"></div></div></div>
    <div class="ctl">
      <button id="shuf" class="ib" type="button" aria-pressed="false" aria-label="シャッフル" data-ico="shuffle"></button>
      <button id="prev" class="ib" type="button" aria-label="前の曲" data-ico="prev"></button>
      <button id="tog" class="ib big" type="button" aria-label="再生/一時停止" data-ico="play"></button>
      <button id="next" class="ib" type="button" aria-label="次の曲" data-ico="next"></button>
      <button id="rep" class="ib" type="button" aria-pressed="false" aria-label="1曲リピート" data-ico="repeat"></button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置"><span id="dur">0:00</span></div>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
  </div>
</div>
<audio id="audio" preload="metadata"></audio>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio'), seek = $('#seek');
const P = {play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',prev:'M6 5h2v14H6zM20 5v14L9 12z',next:'M16 5h2v14h-2zM4 5v14l11-7z',
shuffle:'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z',
repeat:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',
download:'M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z',
search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'};
const ico = n => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${P[n]}"/></svg>`;
document.querySelectorAll('[data-ico]').forEach(b => b.innerHTML = ico(b.dataset.ico));

// 曲ごとに固定のサムネイル色と波形(ファイル名から生成した装飾)
const hsh = s => { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; };
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const thumb = t => { const a = 150 + hsh(t.genre) % 110, b = a + 30 + hsh(t.title) % 50; return `linear-gradient(135deg,hsl(${a} 75% 48%),hsl(${b} 85% 22%))`; };
function wave(t) {
  const w = document.createElement('span'); w.className = 'wave'; const r = rnd(hsh(t.file));
  for (let i = 0; i < 26; i++) { const b = document.createElement('i'); b.style.height = (18 + r() * 82) + '%'; w.appendChild(b); }
  return w;
}

let data, genre = decodeURIComponent(location.hash.slice(1)) || 'all', q = '', view = [], cur = null, shuffle = false, hist = [], dragging = false;
const mb = n => (n / 1048576).toFixed(1) + ' MB';
const mmss = s => (s == null || !isFinite(s)) ? '0:00' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

fetch('index.json').then(r => r.json()).then(d => { data = d; init(); })
  .catch(() => { $('#meta').textContent = 'index.json を読み込めませんでした。build.py を実行し、serve.py 経由で開いてください。'; });

function init() {
  if (genre !== 'all' && !data.genres[genre]) genre = 'all';
  $('#q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
  render();
}
function setGenre(g) {
  genre = g;
  history.replaceState(null, '', g === 'all' ? location.pathname : '#' + encodeURIComponent(g));
  render();
}
function chips() {
  const box = $('#chips'); box.textContent = '';
  const add = (g, label, n) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', genre === g); b.textContent = label;
    const s = document.createElement('small'); s.textContent = n; b.appendChild(s);
    b.onclick = () => setGenre(g); box.appendChild(b);
  };
  add('all', 'すべて', data.count);
  Object.entries(data.genres).forEach(([g, n]) => add(g, g, n));
}
function render() {
  chips();
  view = data.tracks.filter(t => (genre === 'all' || t.genre === genre) &&
    (!q || (t.title + ' ' + t.genre + ' ' + t.file).toLowerCase().includes(q)));
  $('#meta').textContent = view.length + ' 曲';
  const ul = $('#list'); ul.textContent = '';
  if (!view.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = data.count ? '該当する曲がありません。' : 'まだ曲がありません。data フォルダに「ジャンル_タイトル.mp3」を追加してビルドしてください。';
    ul.appendChild(li); return;
  }
  view.forEach((t, i) => {
    const li = document.createElement('li'); li.className = 'row'; li.dataset.url = t.url;
    const ix = document.createElement('span'); ix.className = 'idx'; ix.textContent = String(i + 1).padStart(2, '0');
    const p = document.createElement('button'); p.className = 'ib play'; p.type = 'button'; p.setAttribute('aria-label', t.title + ' を再生');
    p.onclick = () => play(t);
    const th = document.createElement('span'); th.className = 'th'; th.style.background = thumb(t);
    const ti = document.createElement('span'); ti.className = 'title'; ti.textContent = t.title;
    const tag = document.createElement('button'); tag.className = 'tag'; tag.type = 'button'; tag.textContent = t.genre; tag.onclick = () => setGenre(t.genre);
    const du = document.createElement('span'); du.className = 'num dur'; du.textContent = t.duration != null ? mmss(t.duration) : '';
    const nu = document.createElement('span'); nu.className = 'num'; nu.textContent = mb(t.size);
    const dl = document.createElement('a'); dl.className = 'dl'; dl.href = t.url; dl.download = t.file.split('/').pop();
    dl.innerHTML = ico('download') + '保存';
    dl.setAttribute('aria-label', t.title + ' をダウンロード'); dl.title = '利用規約に同意のうえダウンロードしてください';
    li.append(ix, p, th, ti, wave(t), tag, du, nu, dl); ul.appendChild(li);
  });
  mark();
}
function mark() {
  document.querySelectorAll('.row[data-url]').forEach(li => {
    const on = li.dataset.url === cur;
    li.classList.toggle('on', on);
    li.querySelector('.play').innerHTML = ico(on && !audio.paused ? 'pause' : 'play');
  });
  document.querySelectorAll('.row:not(.on) .wave i.f').forEach(c => c.classList.remove('f'));
  $('#tog').innerHTML = ico(audio.paused ? 'play' : 'pause');
}
function play(t, back) {
  if (cur === t.url) { audio.paused ? audio.play() : audio.pause(); return; }
  if (!back && cur) { hist.push(cur); if (hist.length > 50) hist.shift(); }
  cur = t.url; audio.src = t.url; audio.play().catch(() => {});
  $('#bar').classList.add('show'); $('#now').textContent = t.title; $('#npg').textContent = t.genre; $('#pth').style.background = thumb(t);
  seek.value = 0; seek.style.setProperty('--p', '0%'); $('#cur').textContent = '0:00'; $('#dur').textContent = mmss(t.duration);
  mark();
}
function pickRandom() {
  const pool = view.filter(t => t.url !== cur);
  return (pool.length ? pool : view)[Math.floor(Math.random() * (pool.length || view.length))];
}
function next() {
  if (!view.length) return;
  if (shuffle) return play(pickRandom());
  const i = view.findIndex(t => t.url === cur);
  play(view[(i + 1) % view.length]);
}
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (shuffle && hist.length) {
    const t = data.tracks.find(x => x.url === hist.pop());
    if (t) return play(t, true);
  }
  if (!view.length) return;
  const i = view.findIndex(t => t.url === cur);
  play(view[(i <= 0 ? view.length : i) - 1]);
}
function toggle(btn, on) { btn.setAttribute('aria-pressed', on); }
$('#rand').onclick = () => { if (!view.length) return; shuffle = true; toggle($('#shuf'), true); play(pickRandom()); };
$('#shuf').onclick = () => { shuffle = !shuffle; toggle($('#shuf'), shuffle); };
$('#rep').onclick = () => { audio.loop = !audio.loop; toggle($('#rep'), audio.loop); };
$('#prev').onclick = prev;
$('#next').onclick = next;
$('#tog').onclick = () => { if (cur) audio.paused ? audio.play() : audio.pause(); };
$('#vol').oninput = e => { audio.volume = e.target.value; e.target.style.setProperty('--p', e.target.value * 100 + '%'); };
$('#vol').style.setProperty('--p', '100%');

// シークバー: ドラッグ中は再生位置の自動更新を止め、離した時だけ currentTime に反映する
seek.addEventListener('input', () => {
  dragging = true;
  const t = seek.value / 1000 * (audio.duration || 0);
  seek.style.setProperty('--p', seek.value / 10 + '%'); $('#cur').textContent = mmss(t);
});
seek.addEventListener('change', () => {
  if (isFinite(audio.duration)) audio.currentTime = seek.value / 1000 * audio.duration;
  setTimeout(() => dragging = false, 250);
});
audio.addEventListener('timeupdate', () => {
  if (dragging || !isFinite(audio.duration)) return;
  const p = audio.currentTime / audio.duration * 100;
  seek.value = p * 10; seek.style.setProperty('--p', p + '%'); $('#cur').textContent = mmss(audio.currentTime);
  const w = document.querySelector('.row.on .wave');
  if (w) { const k = Math.floor(p / 100 * w.children.length); [...w.children].forEach((c, i) => c.classList.toggle('f', i < k)); }
});
audio.addEventListener('loadedmetadata', () => { $('#dur').textContent = mmss(audio.duration); });
audio.addEventListener('play', mark);
audio.addEventListener('pause', mark);
audio.addEventListener('ended', next);
</script>
</body>
